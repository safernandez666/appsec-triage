<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>appsec-triage — sequence (one alert traced)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f5f5f5;
    --ink:#2d3142;
    --muted:#4f5d75;
    --soft:#7a8399;
    --rule:rgba(45,49,66,0.12);
    --accent:#eb6c36;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Geist',sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1040px;margin:0 auto;padding:48px 32px 64px}
  .eyebrow{font-family:'Geist Mono',monospace;font-size:8px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
  h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:1.75rem;line-height:1.2;margin:0 0 8px;color:var(--ink)}
  .subtitle{font-family:'Geist',sans-serif;font-size:14px;color:var(--muted);margin:0 0 32px;line-height:1.5}
  .diagram{margin:0;padding:0}
  .colophon{margin-top:40px;padding-top:16px;border-top:1px solid var(--rule);font-family:'Geist Mono',monospace;font-size:9px;letter-spacing:0.10em;color:var(--soft);text-transform:uppercase}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">SEQUENCE</p>
  <h1>One alert, traced end to end</h1>
  <p class="subtitle">Reproducible alert in a tier-2 deployed repository. Time flows top &rarr; bottom. The Judge return is the single coral arrow &mdash; the central decision; everything else is plumbing.</p>

  <svg class="diagram" viewBox="0 0 960 720" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="appsec-triage sequence: one alert end to end">
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#f5f5f5"/>

    <!-- ============ LIFELINES (dashed verticals) ============ -->
    <line x1="120" y1="100" x2="120" y2="600" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="320" y1="100" x2="320" y2="600" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="520" y1="100" x2="520" y2="600" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="720" y1="100" x2="720" y2="600" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="920" y1="100" x2="920" y2="600" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- ============ ACTORS (head boxes) ============ -->

    <!-- CLI -->
    <rect x="72" y="56" width="96" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="80" y="64" width="24" height="11" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
    <text x="92" y="72" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em" fill="rgba(45,49,66,0.8)">ENTRY</text>
    <text x="120" y="90" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle" fill="#2d3142">CLI</text>

    <!-- GitHub -->
    <rect x="272" y="56" width="96" height="44" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
    <rect x="280" y="64" width="24" height="11" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
    <text x="292" y="72" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em" fill="rgba(45,49,66,0.8)">EXT</text>
    <text x="320" y="90" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle" fill="#2d3142">GitHub</text>

    <!-- LLM -->
    <rect x="472" y="56" width="96" height="44" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
    <rect x="480" y="64" width="24" height="11" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
    <text x="492" y="72" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em" fill="rgba(45,49,66,0.8)">EXT</text>
    <text x="520" y="90" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle" fill="#2d3142">LLM</text>

    <!-- Engine -->
    <rect x="672" y="56" width="96" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="680" y="64" width="24" height="11" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
    <text x="692" y="72" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em" fill="rgba(45,49,66,0.8)">PY</text>
    <text x="720" y="90" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle" fill="#2d3142">Engine</text>

    <!-- Memory -->
    <rect x="872" y="56" width="96" height="44" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <rect x="880" y="64" width="32" height="11" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
    <text x="896" y="72" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em" fill="rgba(45,49,66,0.8)">STORE</text>
    <text x="920" y="90" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle" fill="#2d3142">Memory</text>

    <!-- ============ MESSAGES (10 arrows, top → bottom) ============ -->

    <!-- 1. CLI → GitHub: list_dependabot_alerts -->
    <line x1="120" y1="132" x2="320" y2="132" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="160" y="116" width="120" height="12" rx="2" fill="#f5f5f5"/>
    <text x="220" y="125" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" fill="#7a8399" letter-spacing="0.06em">LIST ALERTS</text>

    <!-- 2. CLI → LLM: Advisory extract (temp=0) -->
    <line x1="120" y1="172" x2="520" y2="172" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="240" y="156" width="160" height="12" rx="2" fill="#f5f5f5"/>
    <text x="320" y="165" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" fill="#7a8399" letter-spacing="0.06em">ADVISORY APIS · TEMP=0</text>

    <!-- 3. CLI → GitHub: search_code (reachability) -->
    <line x1="120" y1="212" x2="320" y2="212" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="160" y="196" width="120" height="12" rx="2" fill="#f5f5f5"/>
    <text x="220" y="205" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" fill="#7a8399" letter-spacing="0.06em">SEARCH CODE</text>

    <!-- 4. CLI → Engine: evidence + truth table -->
    <line x1="120" y1="252" x2="720" y2="252" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="320" y="236" width="200" height="12" rx="2" fill="#f5f5f5"/>
    <text x="420" y="245" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" fill="#7a8399" letter-spacing="0.06em">EVIDENCE + TRUTH TABLE</text>

    <!-- 5. CLI → Memory: consensus lookup -->
    <line x1="120" y1="292" x2="920" y2="292" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="440" y="276" width="200" height="12" rx="2" fill="#f5f5f5"/>
    <text x="540" y="285" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" fill="#7a8399" letter-spacing="0.06em">CONSENSUS &lt; 3 OTHERS</text>

    <!-- 6. CLI → LLM: Final Judge — outbound -->
    <line x1="120" y1="332" x2="520" y2="332" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="240" y="316" width="200" height="12" rx="2" fill="#f5f5f5"/>
    <text x="340" y="325" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" fill="#7a8399" letter-spacing="0.06em">JUDGE · STRICT JSON · TEMP=0</text>

    <!-- 7. LLM → CLI: Verdict return (CORAL — headline) -->
    <line x1="520" y1="368" x2="120" y2="368" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="220" y="352" width="220" height="12" rx="2" fill="#f5f5f5"/>
    <text x="330" y="361" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" fill="#eb6c36" letter-spacing="0.06em">VERDICT · REPRODUCIBLE @ 0.87</text>

    <!-- 8. CLI → Engine: Prosecutor + Critic + Consistency -->
    <line x1="120" y1="408" x2="720" y2="408" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="280" y="392" width="280" height="12" rx="2" fill="#f5f5f5"/>
    <text x="420" y="401" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" fill="#7a8399" letter-spacing="0.06em">PROSECUTOR · CRITIC · CONSISTENCY</text>

    <!-- 9. CLI → Memory: append_history -->
    <line x1="120" y1="448" x2="920" y2="448" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="440" y="432" width="200" height="12" rx="2" fill="#f5f5f5"/>
    <text x="540" y="441" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" fill="#7a8399" letter-spacing="0.06em">APPEND HISTORY · ONE LINE</text>

    <!-- 10. CLI → GitHub: create Issue -->
    <line x1="120" y1="488" x2="320" y2="488" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="140" y="472" width="160" height="12" rx="2" fill="#f5f5f5"/>
    <text x="220" y="481" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" fill="#7a8399" letter-spacing="0.06em">CREATE ISSUE · LABEL</text>

    <!-- ============ EDITORIAL CALLOUT — tier-1 guardrail (italic serif) ============ -->
    <text x="520" y="544" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle" fill="#eb6c36">verdict was reproducible — no dismiss path.</text>
    <text x="520" y="564" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle" fill="#eb6c36">if it had been false_positive, the tier-1 guardrail</text>
    <text x="520" y="584" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle" fill="#eb6c36">would have blocked auto-dismiss regardless of confidence.</text>

    <!-- ============ LEGEND ============ -->
    <line x1="32" y1="640" x2="928" y2="640" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <text x="32" y="660" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" fill="#4f5d75">LEGEND</text>

    <line x1="120" y1="657" x2="148" y2="657" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="156" y="660" font-size="9" font-family="'Geist Mono', monospace" fill="#4f5d75">CALL</text>

    <line x1="220" y1="657" x2="248" y2="657" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <text x="256" y="660" font-size="9" font-family="'Geist Mono', monospace" fill="#4f5d75">LOOKUP / READ-ONLY</text>

    <line x1="396" y1="657" x2="424" y2="657" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <text x="432" y="660" font-size="9" font-family="'Geist Mono', monospace" fill="#4f5d75">PRIMARY RETURN</text>

    <rect x="556" y="652" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
    <text x="576" y="660" font-size="9" font-family="'Geist Mono', monospace" fill="#4f5d75">EXTERNAL</text>

    <rect x="660" y="652" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <text x="680" y="660" font-size="9" font-family="'Geist Mono', monospace" fill="#4f5d75">STORE</text>
  </svg>

  <p class="colophon">appsec-triage &middot; one alert traced &middot; v0.1.0</p>
</div>
</body>
</html>
