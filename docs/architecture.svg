<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 960" width="800" height="960" role="img" aria-label="appsec-triage pipeline flowchart">
  <defs>
    <style>
      .node-name{font-family:'Geist',system-ui,-apple-system,sans-serif;font-size:12px;font-weight:600;fill:#2d3142}
      .sublabel{font-family:'Geist Mono',ui-monospace,monospace;font-size:9px;fill:#4f5d75}
      .arrow-label{font-family:'Geist Mono',ui-monospace,monospace;font-size:8px;fill:#7a8399;letter-spacing:0.06em}
      .tag-text{font-family:'Geist Mono',ui-monospace,monospace;font-size:7px;letter-spacing:0.08em}
      .callout{font-family:'Instrument Serif','Iowan Old Style','Times New Roman',serif;font-size:14px;font-style:italic;fill:#eb6c36}
      .legend-label{font-family:'Geist Mono',ui-monospace,monospace;font-size:8px;letter-spacing:0.14em;fill:#4f5d75}
      .legend-item{font-family:'Geist Mono',ui-monospace,monospace;font-size:9px;fill:#4f5d75}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- ============ ARROWS ============ -->
  <line x1="400" y1="84" x2="400" y2="124" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

  <line x1="496" y1="164" x2="556" y2="172" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="494" y="146" width="36" height="12" rx="2" fill="#f5f5f5"/>
  <text x="512" y="155" class="arrow-label" text-anchor="middle">YES</text>

  <line x1="400" y1="204" x2="400" y2="240" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="382" y="216" width="36" height="12" rx="2" fill="#f5f5f5"/>
  <text x="400" y="225" class="arrow-label" text-anchor="middle">NO</text>

  <line x1="400" y1="312" x2="400" y2="340" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

  <path d="M 496 380 Q 620 380 620 580 Q 620 612 576 612" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="568" y="396" width="48" height="12" rx="2" fill="#f5f5f5"/>
  <text x="592" y="405" class="arrow-label" text-anchor="middle">SKIP LLM</text>

  <line x1="400" y1="420" x2="400" y2="460" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="382" y="432" width="36" height="12" rx="2" fill="#f5f5f5"/>
  <text x="400" y="441" class="arrow-label" text-anchor="middle">NO</text>

  <line x1="400" y1="524" x2="400" y2="572" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

  <line x1="400" y1="652" x2="400" y2="700" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <line x1="400" y1="788" x2="400" y2="836" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

  <path d="M 640 204 Q 700 204 700 700 Q 700 860 484 860" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- ============ NODES ============ -->

  <!-- START oval -->
  <rect x="320" y="40" width="160" height="44" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="400" y="58" class="node-name" text-anchor="middle">Dependabot alert</text>
  <text x="400" y="72" class="sublabel" text-anchor="middle">/dependabot/alerts</text>

  <!-- D1 diamond -->
  <polygon points="400,124 496,164 400,204 304,164" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="376" y="138" width="20" height="11" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
  <text x="386" y="146" class="tag-text" text-anchor="middle" fill="rgba(45,49,66,0.8)">Z1</text>
  <text x="400" y="166" class="node-name" text-anchor="middle">Already resolved</text>
  <text x="400" y="180" class="node-name" text-anchor="middle">upstream?</text>
  <text x="400" y="192" class="sublabel" text-anchor="middle">routing.py</text>

  <!-- N5 rect — close existing Issue -->
  <rect x="556" y="140" width="180" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="564" y="148" width="20" height="11" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
  <text x="574" y="156" class="tag-text" text-anchor="middle" fill="rgba(45,49,66,0.8)">Z4</text>
  <text x="646" y="178" class="node-name" text-anchor="middle">Close existing Issue</text>
  <text x="646" y="194" class="sublabel" text-anchor="middle">fast path · no LLM</text>

  <!-- N1 rect — Investigate -->
  <rect x="224" y="240" width="352" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="232" y="248" width="20" height="11" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
  <text x="242" y="256" class="tag-text" text-anchor="middle" fill="rgba(45,49,66,0.8)">Z2</text>
  <text x="400" y="278" class="node-name" text-anchor="middle">Investigate</text>
  <text x="400" y="294" class="sublabel" text-anchor="middle">advisory_agent · evidence_agent</text>
  <text x="400" y="306" class="sublabel" text-anchor="middle">temperature=0 on extraction</text>

  <!-- D2 diamond — Verdict forced? -->
  <polygon points="400,340 496,380 400,420 304,380" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="376" y="354" width="20" height="11" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
  <text x="386" y="362" class="tag-text" text-anchor="middle" fill="rgba(45,49,66,0.8)">Z2</text>
  <text x="400" y="382" class="node-name" text-anchor="middle">Verdict forced</text>
  <text x="400" y="396" class="node-name" text-anchor="middle">pre-Judge?</text>
  <text x="400" y="408" class="sublabel" text-anchor="middle">truth_table · memory</text>

  <!-- N2 rect — LLM Judge -->
  <rect x="224" y="460" width="352" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="232" y="468" width="20" height="11" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
  <text x="242" y="476" class="tag-text" text-anchor="middle" fill="rgba(45,49,66,0.8)">Z3</text>
  <text x="400" y="494" class="node-name" text-anchor="middle">Final Judge — LLM</text>
  <text x="400" y="510" class="sublabel" text-anchor="middle">judge.py · strict JSON · temp=0</text>

  <!-- N3 rect — Prosecutor + Critic + Consistency -->
  <rect x="224" y="572" width="352" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="232" y="580" width="20" height="11" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
  <text x="242" y="588" class="tag-text" text-anchor="middle" fill="rgba(45,49,66,0.8)">Z3</text>
  <text x="400" y="610" class="node-name" text-anchor="middle">Prosecutor · Critic · Consistency</text>
  <text x="400" y="626" class="sublabel" text-anchor="middle">degrade-only · recompute once</text>
  <text x="400" y="640" class="sublabel" text-anchor="middle">append-only .triage_history.jsonl</text>

  <!-- N4 rect (CORAL FOCAL) -->
  <rect x="224" y="700" width="352" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <rect x="232" y="708" width="20" height="11" rx="2" fill="transparent" stroke="rgba(235,108,54,0.6)" stroke-width="0.8"/>
  <text x="242" y="716" class="tag-text" text-anchor="middle" fill="rgba(235,108,54,0.9)">Z4</text>
  <text x="400" y="738" class="node-name" text-anchor="middle">Issue create / comment</text>
  <text x="400" y="754" class="node-name" text-anchor="middle">+ optional Dependabot dismiss</text>
  <text x="400" y="770" class="sublabel" text-anchor="middle">issue_manager.py · tier-1 guardrail</text>

  <!-- END oval -->
  <rect x="320" y="836" width="160" height="44" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="400" y="854" class="node-name" text-anchor="middle">Cycle complete</text>
  <text x="400" y="868" class="sublabel" text-anchor="middle">history appended</text>

  <!-- ============ EDITORIAL CALLOUT — coral, marks the guardrail ============ -->
  <text x="64" y="724" class="callout" text-anchor="start">tier-1 critical repos are</text>
  <text x="64" y="744" class="callout" text-anchor="start">never auto-dismissed —</text>
  <text x="64" y="764" class="callout" text-anchor="start">non-negotiable</text>
  <path d="M 184 760 Q 200 760 224 752" fill="none" stroke="rgba(235,108,54,0.5)" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="224" cy="752" r="2" fill="#eb6c36"/>

  <!-- ============ LEGEND ============ -->
  <line x1="32" y1="912" x2="768" y2="912" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="32" y="932" class="legend-label">LEGEND</text>

  <rect x="120" y="924" width="14" height="12" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="140" y="933" class="legend-item">START / END</text>

  <polygon points="244,924 256,930 244,936 232,930" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="264" y="933" class="legend-item">DECISION</text>

  <rect x="344" y="924" width="14" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="364" y="933" class="legend-item">STEP</text>

  <rect x="404" y="924" width="14" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="424" y="933" class="legend-item">GUARDRAIL</text>

  <line x1="500" y1="930" x2="528" y2="930" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="536" y="933" class="legend-item">FAST PATH</text>
</svg>
