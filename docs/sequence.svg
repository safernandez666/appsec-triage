<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-label="appsec-triage sequence: one alert end to end">
  <defs>
    <style>
      .actor-name{font-family:'Geist',system-ui,-apple-system,sans-serif;font-size:12px;font-weight:600;fill:#2d3142}
      .arrow-label{font-family:'Geist Mono',ui-monospace,monospace;font-size:8px;letter-spacing:0.06em;fill:#7a8399}
      .arrow-label-accent{font-family:'Geist Mono',ui-monospace,monospace;font-size:8px;letter-spacing:0.06em;fill:#eb6c36}
      .tag-text{font-family:'Geist Mono',ui-monospace,monospace;font-size:7px;letter-spacing:0.08em;fill:rgba(45,49,66,0.8)}
      .callout{font-family:'Instrument Serif','Iowan Old Style','Times New Roman',serif;font-size:14px;font-style:italic;fill:#eb6c36}
      .legend-label{font-family:'Geist Mono',ui-monospace,monospace;font-size:8px;letter-spacing:0.14em;fill:#4f5d75}
      .legend-item{font-family:'Geist Mono',ui-monospace,monospace;font-size:9px;fill:#4f5d75}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- LIFELINES -->
  <line x1="120" y1="100" x2="120" y2="600" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="320" y1="100" x2="320" y2="600" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="520" y1="100" x2="520" y2="600" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="720" y1="100" x2="720" y2="600" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="920" y1="100" x2="920" y2="600" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ACTORS -->
  <rect x="72" y="56" width="96" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="80" y="64" width="24" height="11" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
  <text x="92" y="72" class="tag-text" text-anchor="middle">ENTRY</text>
  <text x="120" y="90" class="actor-name" text-anchor="middle">CLI</text>

  <rect x="272" y="56" width="96" height="44" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <rect x="280" y="64" width="24" height="11" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
  <text x="292" y="72" class="tag-text" text-anchor="middle">EXT</text>
  <text x="320" y="90" class="actor-name" text-anchor="middle">GitHub</text>

  <rect x="472" y="56" width="96" height="44" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <rect x="480" y="64" width="24" height="11" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
  <text x="492" y="72" class="tag-text" text-anchor="middle">EXT</text>
  <text x="520" y="90" class="actor-name" text-anchor="middle">LLM</text>

  <rect x="672" y="56" width="96" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="680" y="64" width="24" height="11" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
  <text x="692" y="72" class="tag-text" text-anchor="middle">PY</text>
  <text x="720" y="90" class="actor-name" text-anchor="middle">Engine</text>

  <rect x="872" y="56" width="96" height="44" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <rect x="880" y="64" width="32" height="11" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
  <text x="896" y="72" class="tag-text" text-anchor="middle">STORE</text>
  <text x="920" y="90" class="actor-name" text-anchor="middle">Memory</text>

  <!-- MESSAGES -->

  <line x1="120" y1="132" x2="320" y2="132" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="160" y="116" width="120" height="12" rx="2" fill="#f5f5f5"/>
  <text x="220" y="125" class="arrow-label" text-anchor="middle">LIST ALERTS</text>

  <line x1="120" y1="172" x2="520" y2="172" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="240" y="156" width="160" height="12" rx="2" fill="#f5f5f5"/>
  <text x="320" y="165" class="arrow-label" text-anchor="middle">ADVISORY APIS · TEMP=0</text>

  <line x1="120" y1="212" x2="320" y2="212" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="160" y="196" width="120" height="12" rx="2" fill="#f5f5f5"/>
  <text x="220" y="205" class="arrow-label" text-anchor="middle">SEARCH CODE</text>

  <line x1="120" y1="252" x2="720" y2="252" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="320" y="236" width="200" height="12" rx="2" fill="#f5f5f5"/>
  <text x="420" y="245" class="arrow-label" text-anchor="middle">EVIDENCE + TRUTH TABLE</text>

  <line x1="120" y1="292" x2="920" y2="292" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="440" y="276" width="200" height="12" rx="2" fill="#f5f5f5"/>
  <text x="540" y="285" class="arrow-label" text-anchor="middle">CONSENSUS &lt; 3 OTHERS</text>

  <line x1="120" y1="332" x2="520" y2="332" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="240" y="316" width="200" height="12" rx="2" fill="#f5f5f5"/>
  <text x="340" y="325" class="arrow-label" text-anchor="middle">JUDGE · STRICT JSON · TEMP=0</text>

  <line x1="520" y1="368" x2="120" y2="368" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="220" y="352" width="220" height="12" rx="2" fill="#f5f5f5"/>
  <text x="330" y="361" class="arrow-label-accent" text-anchor="middle">VERDICT · REPRODUCIBLE @ 0.87</text>

  <line x1="120" y1="408" x2="720" y2="408" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="280" y="392" width="280" height="12" rx="2" fill="#f5f5f5"/>
  <text x="420" y="401" class="arrow-label" text-anchor="middle">PROSECUTOR · CRITIC · CONSISTENCY</text>

  <line x1="120" y1="448" x2="920" y2="448" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="440" y="432" width="200" height="12" rx="2" fill="#f5f5f5"/>
  <text x="540" y="441" class="arrow-label" text-anchor="middle">APPEND HISTORY · ONE LINE</text>

  <line x1="120" y1="488" x2="320" y2="488" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="140" y="472" width="160" height="12" rx="2" fill="#f5f5f5"/>
  <text x="220" y="481" class="arrow-label" text-anchor="middle">CREATE ISSUE · LABEL</text>

  <!-- CALLOUT -->
  <text x="520" y="544" class="callout" text-anchor="middle">verdict was reproducible — no dismiss path.</text>
  <text x="520" y="564" class="callout" text-anchor="middle">if it had been false_positive, the tier-1 guardrail</text>
  <text x="520" y="584" class="callout" text-anchor="middle">would have blocked auto-dismiss regardless of confidence.</text>

  <!-- LEGEND -->
  <line x1="32" y1="640" x2="928" y2="640" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="32" y="660" class="legend-label">LEGEND</text>

  <line x1="120" y1="657" x2="148" y2="657" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="156" y="660" class="legend-item">CALL</text>

  <line x1="220" y1="657" x2="248" y2="657" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="256" y="660" class="legend-item">LOOKUP / READ-ONLY</text>

  <line x1="396" y1="657" x2="424" y2="657" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <text x="432" y="660" class="legend-item">PRIMARY RETURN</text>

  <rect x="556" y="652" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="576" y="660" class="legend-item">EXTERNAL</text>

  <rect x="660" y="652" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="680" y="660" class="legend-item">STORE</text>
</svg>
