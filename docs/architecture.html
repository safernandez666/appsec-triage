<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>appsec-triage — pipeline architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f5f5f5;
    --ink:#2d3142;
    --muted:#4f5d75;
    --soft:#7a8399;
    --rule:rgba(45,49,66,0.12);
    --accent:#eb6c36;
    --accent-tint:rgba(235,108,54,0.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Geist',sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:880px;margin:0 auto;padding:48px 32px 64px}
  .eyebrow{font-family:'Geist Mono',monospace;font-size:8px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
  h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:1.75rem;line-height:1.2;margin:0 0 8px;color:var(--ink)}
  .subtitle{font-family:'Geist',sans-serif;font-size:14px;color:var(--muted);margin:0 0 32px;line-height:1.5}
  .diagram{margin:0;padding:0}
  .colophon{margin-top:40px;padding-top:16px;border-top:1px solid var(--rule);font-family:'Geist Mono',monospace;font-size:9px;letter-spacing:0.10em;color:var(--soft);text-transform:uppercase}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">PIPELINE</p>
  <h1>Defensive triage — one alert end to end</h1>
  <p class="subtitle">Z1 routing &middot; Z2 investigation &middot; Z3 judgment &middot; Z4 output. The LLM never acts alone: deterministic gates in (Truth Table) and out (Prosecutor, Critic, Consistency).</p>

  <svg class="diagram" viewBox="0 0 800 960" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="appsec-triage pipeline flowchart">
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
      </marker>
    </defs>

    <!-- background -->
    <rect width="100%" height="100%" fill="#f5f5f5"/>

    <!-- ============ ARROWS (drawn first, behind boxes) ============ -->

    <!-- 1: START → D1 -->
    <line x1="400" y1="84" x2="400" y2="124" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- 2: D1 right (Yes — already resolved) → N5 -->
    <line x1="496" y1="164" x2="556" y2="172" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="494" y="146" width="36" height="12" rx="2" fill="#f5f5f5"/>
    <text x="512" y="155" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

    <!-- 3: D1 bottom (No — continue) → N1 -->
    <line x1="400" y1="204" x2="400" y2="240" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="382" y="216" width="36" height="12" rx="2" fill="#f5f5f5"/>
    <text x="400" y="225" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

    <!-- 4: N1 → D2 -->
    <line x1="400" y1="312" x2="400" y2="340" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- 5: D2 right (Yes — forced/consensus) → N3 (skipping Judge), curved -->
    <path d="M 496 380 Q 620 380 620 580 Q 620 612 576 612" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="568" y="396" width="48" height="12" rx="2" fill="#f5f5f5"/>
    <text x="592" y="405" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SKIP LLM</text>

    <!-- 6: D2 bottom (No) → N2 -->
    <line x1="400" y1="420" x2="400" y2="460" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="382" y="432" width="36" height="12" rx="2" fill="#f5f5f5"/>
    <text x="400" y="441" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

    <!-- 7: N2 → N3 -->
    <line x1="400" y1="524" x2="400" y2="572" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- 8: N3 → N4 (accent stroke — this is the highlight transition into the guardrail step) -->
    <line x1="400" y1="652" x2="400" y2="700" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <!-- 9: N4 → END -->
    <line x1="400" y1="788" x2="400" y2="836" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- 10: N5 → END (curved down-right then back-left) -->
    <path d="M 640 204 Q 700 204 700 700 Q 700 860 484 860" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

    <!-- ============ NODES ============ -->

    <!-- START oval — Dependabot alert -->
    <rect x="320" y="40" width="160" height="44" rx="20" fill="#f5f5f5"/>
    <rect x="320" y="40" width="160" height="44" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="400" y="58" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dependabot alert</text>
    <text x="400" y="72" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/dependabot/alerts</text>

    <!-- D1 diamond — Z1 routing -->
    <polygon points="400,124 496,164 400,204 304,164" fill="#f5f5f5"/>
    <polygon points="400,124 496,164 400,204 304,164" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="376" y="138" width="20" height="11" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
    <text x="386" y="146" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">Z1</text>
    <text x="400" y="166" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Already resolved</text>
    <text x="400" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">upstream?</text>
    <text x="400" y="192" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">routing.py</text>

    <!-- N5 rect — Z4 close existing Issue (Yes branch) -->
    <rect x="556" y="140" width="180" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="556" y="140" width="180" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="564" y="148" width="20" height="11" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
    <text x="574" y="156" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">Z4</text>
    <text x="646" y="178" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Close existing Issue</text>
    <text x="646" y="194" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fast path · no LLM</text>

    <!-- N1 rect — Z2 investigate -->
    <rect x="224" y="240" width="352" height="72" rx="6" fill="#f5f5f5"/>
    <rect x="224" y="240" width="352" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="232" y="248" width="20" height="11" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
    <text x="242" y="256" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">Z2</text>
    <text x="400" y="278" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Investigate</text>
    <text x="400" y="294" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">advisory_agent &middot; evidence_agent</text>
    <text x="400" y="306" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">temperature=0 on extraction</text>

    <!-- D2 diamond — Z2 verdict forced? -->
    <polygon points="400,340 496,380 400,420 304,380" fill="#f5f5f5"/>
    <polygon points="400,340 496,380 400,420 304,380" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="376" y="354" width="20" height="11" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
    <text x="386" y="362" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">Z2</text>
    <text x="400" y="382" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Verdict forced</text>
    <text x="400" y="396" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">pre-Judge?</text>
    <text x="400" y="408" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">truth_table &middot; memory</text>

    <!-- N2 rect — Z3 LLM Judge -->
    <rect x="224" y="460" width="352" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="224" y="460" width="352" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="232" y="468" width="20" height="11" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
    <text x="242" y="476" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">Z3</text>
    <text x="400" y="494" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Final Judge — LLM</text>
    <text x="400" y="510" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">judge.py &middot; strict JSON &middot; temp=0</text>

    <!-- N3 rect — Z3 prosecutor + critic + consistency -->
    <rect x="224" y="572" width="352" height="80" rx="6" fill="#f5f5f5"/>
    <rect x="224" y="572" width="352" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="232" y="580" width="20" height="11" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
    <text x="242" y="588" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">Z3</text>
    <text x="400" y="610" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Prosecutor &middot; Critic &middot; Consistency</text>
    <text x="400" y="626" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">degrade-only &middot; recompute once</text>
    <text x="400" y="640" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">append-only .triage_history.jsonl</text>

    <!-- N4 rect (CORAL FOCAL) — Z4 issue + dismiss with guardrail -->
    <rect x="224" y="700" width="352" height="88" rx="6" fill="#f5f5f5"/>
    <rect x="224" y="700" width="352" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <rect x="232" y="708" width="20" height="11" rx="2" fill="transparent" stroke="rgba(235,108,54,0.6)" stroke-width="0.8"/>
    <text x="242" y="716" fill="rgba(235,108,54,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">Z4</text>
    <text x="400" y="738" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Issue create / comment</text>
    <text x="400" y="754" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">+ optional Dependabot dismiss</text>
    <text x="400" y="770" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">issue_manager.py &middot; tier-1 guardrail</text>

    <!-- END oval — Cycle complete -->
    <rect x="320" y="836" width="160" height="44" rx="20" fill="#f5f5f5"/>
    <rect x="320" y="836" width="160" height="44" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="400" y="854" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cycle complete</text>
    <text x="400" y="868" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">history appended</text>

    <!-- ============ EDITORIAL CALLOUT — coral, marks the guardrail ============ -->
    <text x="64" y="724" fill="#eb6c36" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">tier-1 critical repos are</text>
    <text x="64" y="744" fill="#eb6c36" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">never auto-dismissed —</text>
    <text x="64" y="764" fill="#eb6c36" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">non-negotiable</text>
    <path d="M 184 760 Q 200 760 224 752" fill="none" stroke="rgba(235,108,54,0.5)" stroke-width="1" stroke-dasharray="4,3"/>
    <circle cx="224" cy="752" r="2" fill="#eb6c36"/>

    <!-- ============ LEGEND (horizontal strip) ============ -->
    <line x1="32" y1="912" x2="768" y2="912" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <text x="32" y="932" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

    <rect x="120" y="924" width="14" height="12" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="140" y="933" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">START / END</text>

    <polygon points="244,924 256,930 244,936 232,930" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="264" y="933" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">DECISION</text>

    <rect x="344" y="924" width="14" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="364" y="933" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">STEP</text>

    <rect x="404" y="924" width="14" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <text x="424" y="933" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">GUARDRAIL</text>

    <line x1="500" y1="930" x2="528" y2="930" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
    <text x="536" y="933" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">FAST PATH</text>
  </svg>

  <p class="colophon">appsec-triage &middot; pipeline architecture &middot; v0.1.0</p>
</div>
</body>
</html>
